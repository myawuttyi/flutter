name: flutter_bloc_auth_profile
description: Flutter Login, Register & User Profile System using BLoC Architecture, Firebase Auth, and Cloud Firestore.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  image_picker: ^1.1.2
  http: ^1.6.0
  bloc: ^8.1.4
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_bloc: ^8.1.3 # Flutter BLoC Official Package
  

flutter:
  uses-material-design: true
